<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#4c0519"/>
      <stop offset="60%" stop-color="#1f020d"/>
      <stop offset="100%" stop-color="#0a0105"/>
    </radialGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fda4af"/>
      <stop offset="25%" stop-color="#fb7185"/>
      <stop offset="70%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded squircle with subtle border -->
  <rect x="4" y="4" width="120" height="120" rx="34" fill="url(#bgGrad)" stroke="#fb7185" stroke-width="1.5" stroke-opacity="0.35"/>
  
  <!-- Ambient rose glow behind heart -->
  <circle cx="64" cy="62" r="42" fill="url(#glow)"/>

  <!-- Romantic Heart -->
  <path d="M64 96 C64 96 22 72 22 45 C22 30.5 33.5 20 47.5 20 C55.5 20 61.5 24.5 64 28 C66.5 24.5 72.5 20 80.5 20 C94.5 20 106 30.5 106 45 C106 72 64 96 64 96 Z"
        fill="url(#heartGrad)" filter="url(#softGlow)"/>
        
  <!-- Subtle heart highlight -->
  <path d="M33 34 C38 27 46 25 51 27 C42 31 38 41 38 48 C34 44 32 38 33 34 Z" fill="#ffffff" opacity="0.55"/>

  <!-- Sparkling Golden Star Accent -->
  <path d="M92 24 L94 29 L99 31 L94 33 L92 38 L90 33 L85 31 L90 29 Z" fill="#fef08a" opacity="0.9"/>
  <path d="M36 78 L37 81 L40 82 L37 83 L36 86 L35 83 L32 82 L35 81 Z" fill="#fef08a" opacity="0.75"/>
</svg>