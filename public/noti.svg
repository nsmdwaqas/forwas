<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 740" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#3b3147" />
      <stop offset="45%" stop-color="#231d2c" />
      <stop offset="85%" stop-color="#14111a" />
      <stop offset="100%" stop-color="#0c0a10" />
    </radialGradient>

    <!-- Outer distressed ring glow -->
    <filter id="grungeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Notification Card Drop Shadow -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <!-- Avatar Badge Shadow -->
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.3" />
    </filter>

    <!-- WhatsApp Green Gradient -->
    <linearGradient id="waGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2fe674" />
      <stop offset="100%" stop-color="#20ba59" />
    </linearGradient>

    <!-- Frosted Glass Card Gradient -->
    <linearGradient id="cardGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.94)" />
      <stop offset="100%" stop-color="rgba(242, 242, 247, 0.88)" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="740" height="740" fill="url(#bgGrad)" />

  <!-- Soft lavender background haze on edges matching photo -->
  <rect width="740" height="740" fill="#a493bd" opacity="0.18" />

  <!-- ==================== CENTRAL DISTRESSED CIRCLE ==================== -->
  <g transform="translate(370, 240)">
    <!-- Distressed white splatter perimeter simulation -->
    <circle cx="0" cy="0" r="185" fill="none" stroke="#e0d6ed" stroke-width="8" stroke-dasharray="12, 6, 4, 8, 20, 5, 2, 9" opacity="0.85" filter="url(#grungeGlow)" />
    <circle cx="0" cy="0" r="182" fill="none" stroke="#ffffff" stroke-width="4" stroke-dasharray="4, 14, 18, 5, 8, 22" opacity="0.6" />
    <circle cx="0" cy="0" r="189" fill="none" stroke="#d5c8e6" stroke-width="3" stroke-dasharray="2, 8, 12, 16, 5" opacity="0.5" />
    
    <!-- Dark Inner Circle -->
    <circle cx="0" cy="0" r="176" fill="#15121b" />

    <!-- Top Tamil Calligraphy: வகாஸ் (Vakas = Waqas) -->
    <text x="0" y="-105" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" fill="#ffffff" letter-spacing="2">
      வகாஸ்
    </text>

    <!-- Left Silhouette / Sketch Graphic -->
    <g transform="translate(-70, -10)" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.75">
      <line x1="-20" y1="50" x2="30" y2="-50" stroke-width="4" />
      <line x1="15" y1="40" x2="-25" y2="-30" stroke-width="3" />
      <line x1="5" y1="-60" x2="5" y2="60" stroke-width="2" />
      <circle cx="5" cy="-20" r="12" fill="none" stroke-width="2.5" />
      <path d="M-15,10 Q5,30 25,10" fill="none" />
    </g>

    <!-- Right Urdu Calligraphy Badge: وقاص (Waqas) -->
    <g transform="translate(65, -80)">
      <rect x="-35" y="-16" width="70" height="32" rx="16" fill="#ffffff" opacity="0.88" />
      <text x="0" y="6" text-anchor="middle" font-family="'Noto Naskh Arabic', 'Traditional Arabic', sans-serif" font-size="18" font-weight="bold" fill="#15121b">
        وقاص
      </text>
    </g>

    <!-- Right Big Kanji / Hanzi: 和歌 -->
    <text x="75" y="10" text-anchor="middle" font-family="'Hiragino Mincho ProN', 'Yu Mincho', serif" font-size="78" font-weight="bold" fill="#ffffff" opacity="0.95">
      和
    </text>
    <text x="75" y="85" text-anchor="middle" font-family="'Hiragino Mincho ProN', 'Yu Mincho', serif" font-size="62" font-weight="bold" fill="#ffffff" opacity="0.8">
      歌
    </text>

    <!-- Bottom handwritten Script: waqas -->
    <text x="-15" y="45" text-anchor="middle" font-family="'Caveat', 'Brush Script MT', cursive, sans-serif" font-size="26" font-weight="500" fill="#ffffff" opacity="0.85" letter-spacing="1">
      waqas
    </text>
  </g>

  <!-- ==================== NOTIFICATION CENTRE HEADER ==================== -->
  <g transform="translate(48, 410)">
    <!-- Header Title -->
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="600" fill="#ffffff" letter-spacing="-0.5">
      Notification Centre
    </text>

    <!-- Close 'X' Button on Right -->
    <g transform="translate(644, -12)">
      <circle cx="0" cy="0" r="22" fill="#ffffff" opacity="0.9" />
      <path d="M-7,-7 L7,7 M7,-7 L-7,7" stroke="#15121b" stroke-width="2.8" stroke-linecap="round" />
    </g>
  </g>

  <!-- ==================== STACKED NOTIFICATION CARDS ==================== -->
  <!-- Bottom Stack Layer 2 -->
  <g transform="translate(85, 570)" opacity="0.4">
    <rect x="0" y="0" width="570" height="24" rx="12" fill="#ffffff" />
  </g>

  <!-- Bottom Stack Layer 1 -->
  <g transform="translate(66, 560)" opacity="0.68">
    <rect x="0" y="0" width="608" height="24" rx="14" fill="#ffffff" />
  </g>

  <!-- Top Active Notification Card -->
  <g transform="translate(48, 445)" filter="url(#cardShadow)">
    <!-- Card Glass Background -->
    <rect x="0" y="0" width="644" height="126" rx="36" fill="url(#cardGlass)" stroke="rgba(255, 255, 255, 0.6)" stroke-width="1.2" />

    <!-- Avatar Container -->
    <g transform="translate(24, 23)">
      <!-- Slate-Blue Avatar Circle -->
      <circle cx="40" cy="40" r="40" fill="#60769d" />
      <text x="40" y="52" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="36" font-weight="600" fill="#ffffff">
        R
      </text>

      <!-- 18 Stack Counter Badge (Top Right of Avatar) -->
      <g transform="translate(60, 4)" filter="url(#badgeShadow)">
        <rect x="-18" y="-12" width="36" height="25" rx="12.5" fill="#ffffff" stroke="#e0e0e0" stroke-width="0.8" />
        <text x="0" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700" fill="#222222">
          18
        </text>
      </g>

      <!-- WhatsApp Call Badge (Bottom Right of Avatar) -->
      <g transform="translate(62, 60)" filter="url(#badgeShadow)">
        <circle cx="0" cy="0" r="14" fill="url(#waGreen)" stroke="#ffffff" stroke-width="2.2" />
        <!-- Phone Handset Icon -->
        <path d="M-5,-4 C-6,-2 -4,3 0,5 C4,7 7,5 7,3 L5.5,1 C5,0.5 4.2,0.8 3.8,1.2 L3,2 C2.5,1.7 1.2,0.5 0.9,0 L1.7,-0.8 C2.1,-1.2 2.4,-2 1.9,-2.5 L0.5,-4 C0,-4.5 -0.5,-4.5 -1,-4 Z" fill="#ffffff" transform="translate(0, 0) scale(1.2)" />
      </g>
    </g>

    <!-- Text Information -->
    <!-- Contact Name with Red Heart -->
    <text x="124" y="60" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="24" font-weight="700" fill="#111111">
      ruhi.. <tspan fill="#e53935">❤️</tspan>
    </text>

    <!-- Timestamp: 5:11 AM -->
    <text x="616" y="58" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="20" font-weight="400" fill="#66666e">
      5:11 AM
    </text>

    <!-- Missed call subtext -->
    <text x="124" y="93" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="21" font-weight="400" fill="#2c2c2e">
      Missed call
    </text>
  </g>
</svg>
